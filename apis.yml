name: The Nudge
description: >-
  The Nudge is a free consumer lifestyle app that texts its members short videos
  from locals recommending their favorite real-world things to do — secret hikes,
  date ideas, restaurants, and activities — a few "Nudges" each week to help people
  (primarily millennials) have more fun in real life and be more adventurous,
  romantic, and social. Founded in 2018 by siblings Sarah and John Peterson and
  based in San Francisco, The Nudge is available on iOS and Android and is backed
  by Lightspeed Venture Partners among other investors. It is a business-to-consumer
  product delivered over SMS and mobile apps, with no public API or developer program.
